<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .metric-card { background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); border: 1px solid #e2e8f0; padding: 22px; border-radius: 16px; }
        .sidebar { background-color: #ffffff; border-right: 1px solid #e2e8f0; min-height: 100vh; }
        .btn-custom { background-color: #0f172a; color: #ffffff; border-radius: 10px; border: none; padding: 10px 22px; font-weight: 500; }
        .btn-custom:hover { background-color: #1e293b; color: #ffffff; }
        .card-form { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; }
        .list-group-item { border-radius: 10px !important; margin-bottom: 6px; border: none !important; font-weight: 500; }
        .list-group-item.active { background-color: #0f172a !important; color: white !important; }
        .room-img { height: 160px; object-fit: cover; border-top-left-radius: 12px; border-top-right-radius: 12px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 sidebar p-4">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-dark text-white rounded-3 p-2 me-2"><i class="fa-solid fa-hotel fa-lg"></i></div>
                    <h4 class="mb-0 fw-bold">Hotel Booking</h4>
                </div>
                <div class="p-3 bg-light rounded-4 mb-4 border">
                    <p class="mb-1 text-muted small"><i class="fa-solid fa-user me-1 text-primary"></i> User: <strong id="displayUsername"></strong></p>
                    <p class="mb-0 text-muted small"><i class="fa-solid fa-shield-halved me-1 text-success"></i> Role: <span class="badge bg-dark" id="displayRole"></span></p>
                </div>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm w-100 mb-4 py-2 rounded-3">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                </button>
                <hr>
                <h6 class="text-secondary text-uppercase fw-bold mb-3"><i class="fa-solid fa-compass me-2"></i> Navigation</h6>
                <div class="list-group list-group-flush" id="menuList"></div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 p-5" id="mainContent">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3 text-muted">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
